name: CI/CD Pipeline
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install dependencies
        working-directory: ./my-app
        run: npm install
      - name: Run tests with coverage
        working-directory: ./my-app
        run: npx react-scripts test --coverage --watchAll=false --passWithNoTests
        continue-on-error: true
        env:
          CI: false
      - name: Print coverage summary
        working-directory: ./my-app
        run: |
          echo "========================================"
          echo "         CODE COVERAGE SUMMARY"
          echo "========================================"
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              console.log('Statements : ' + s.statements.pct + '%');
              console.log('Branches   : ' + s.branches.pct + '%');
              console.log('Functions  : ' + s.functions.pct + '%');
              console.log('Lines      : ' + s.lines.pct + '%');
            "
          else
            echo "No coverage report found."
          fi
          echo "========================================"
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./my-app/coverage/lcov.info
          fail_ci_if_error: false
  build:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install + Build
        working-directory: ./my-app
        run: |
          npm install
          npm run build
        env:
          CI: false
          REACT_APP_FIREBASE_API_KEY: AIzaSyC8fapW8_Cn_rLzfkPeYMUuO4kPDisSlNs
          REACT_APP_FIREBASE_AUTH_DOMAIN: tspecproj.firebaseapp.com
          REACT_APP_FIREBASE_PROJECT_ID: tspecproj
          REACT_APP_FIREBASE_STORAGE_BUCKET: tspecproj.firebasestorage.app
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: 232065407197
          REACT_APP_FIREBASE_APP_ID: 1:232065407197:web:4dd98eb3053b1e64092334
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./my-app/build
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./my-app/build
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'UbuntuCareers'
          slot-name: 'Production'
          package: ./my-app/build
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_69C9B4F571244BB0AA7474BC29A01C9C }}
