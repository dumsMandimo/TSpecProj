name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        working-directory: ./my-app
        run: npm install

      - name: Run tests with coverage
        working-directory: ./my-app
        run: npx react-scripts test --coverage --watchAll=false --passWithNoTests
        continue-on-error: true
        env:
          CI: false

      - name: Print coverage summary
        working-directory: ./my-app
        run: |
          echo "========================================"
          echo "         CODE COVERAGE SUMMARY"
          echo "========================================"

          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              console.log('Statements : ' + s.statements.pct + '%');
              console.log('Branches   : ' + s.branches.pct + '%');
              console.log('Functions  : ' + s.functions.pct + '%');
              console.log('Lines      : ' + s.lines.pct + '%');
            "
          else
            echo "No coverage report found."
          fi

          echo "========================================"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./my-app/coverage/lcov.info
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        working-directory: ./my-app
        run: npm install

      - name: Build React app
        working-directory: ./my-app
        run: npm run build
        env:
          CI: false
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}

      - name: Prepare deployment package
        run: |
          mkdir -p ./deploy-package

          cp ./my-app/server.js ./deploy-package/
          cp ./my-app/package.json ./deploy-package/
          cp ./my-app/package-lock.json ./deploy-package/

          cp -r ./my-app/build ./deploy-package/build

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./deploy-package
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./build-output

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'UbuntuCareers'
          slot-name: 'Production'
          package: ./build-output
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_69C9B4F571244BB0AA7474BC29A01C9C }}
